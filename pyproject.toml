[project]
name = "search-agent-react"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
search-agent-react = "search_agent_react:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
